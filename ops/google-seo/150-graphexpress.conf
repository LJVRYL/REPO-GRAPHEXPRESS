<VirtualHost *:80>
    ServerName graphexpress.com.ar
    ServerAlias www.graphexpress.com.ar
    DocumentRoot /home/graphexpress/public_html
    DirectoryIndex index.php index.html

    <Directory "/home/graphexpress/public_html">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Public commercial GET/HEAD routes only; callbacks and private routes stay here.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{QUERY_STRING} !(^|&)(?:wc-api|rest_route|token|key|order_key|access_token|auth|code|action)= [NC]
    RewriteRule ^/(?:$|(?:tienda|shop|producto|product|product-category|categoria-producto|category|tag|guia|guias|contacto|trabaja-con-nosotros|politica-de-privacidad)(?:/.*)?$|robots\.txt$|(?:wp-sitemap|sitemap_index)(?:-[a-z0-9_-]+)?\.xml$) https://graphex.ar%{REQUEST_URI} [R=301,L,NE]

    RedirectMatch 404 ^/patricio(?:/.*)?$

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/opt/php7-4/var/run/php-fpm/graphex.sock|fcgi://localhost"
    </FilesMatch>

    ProxyPass        /mantenimientoftth  http://127.0.0.1:3010/mantenimientoftth
    ProxyPassReverse /mantenimientoftth  http://127.0.0.1:3010/mantenimientoftth
    ProxyPass        /mantenimientoftth/ http://127.0.0.1:3010/mantenimientoftth/
    ProxyPassReverse /mantenimientoftth/ http://127.0.0.1:3010/mantenimientoftth/

    ErrorLog  /opt/ferozo/logs/graphexpress_error.log
    CustomLog /opt/ferozo/logs/graphexpress_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName graphexpress.com.ar
    ServerAlias www.graphexpress.com.ar
    DocumentRoot /home/graphexpress/public_html
    DirectoryIndex index.php index.html

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/graphexpress.com.ar/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/graphexpress.com.ar/privkey.pem

    <Directory "/home/graphexpress/public_html">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Public commercial GET/HEAD routes only; callbacks and private routes stay here.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{QUERY_STRING} !(^|&)(?:wc-api|rest_route|token|key|order_key|access_token|auth|code|action)= [NC]
    RewriteRule ^/(?:$|(?:tienda|shop|producto|product|product-category|categoria-producto|category|tag|guia|guias|contacto|trabaja-con-nosotros|politica-de-privacidad)(?:/.*)?$|robots\.txt$|(?:wp-sitemap|sitemap_index)(?:-[a-z0-9_-]+)?\.xml$) https://graphex.ar%{REQUEST_URI} [R=301,L,NE]

    RedirectMatch 404 ^/patricio(?:/.*)?$

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/opt/php7-4/var/run/php-fpm/graphex.sock|fcgi://localhost"
    </FilesMatch>

    ProxyPass        /mantenimientoftth  http://127.0.0.1:3010/mantenimientoftth
    ProxyPassReverse /mantenimientoftth  http://127.0.0.1:3010/mantenimientoftth
    ProxyPass        /mantenimientoftth/ http://127.0.0.1:3010/mantenimientoftth/
    ProxyPassReverse /mantenimientoftth/ http://127.0.0.1:3010/mantenimientoftth/

    ErrorLog  /opt/ferozo/logs/graphexpress_ssl_error.log
    CustomLog /opt/ferozo/logs/graphexpress_ssl_access.log combined
</VirtualHost>
